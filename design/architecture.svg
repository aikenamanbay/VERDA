<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 610" width="1000" height="610" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Verda app diagram: screens, data layer, Firebase</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#0F3D2E"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#8A938F"/></marker>
    <style>
      .col{fill:#F6F7F5;stroke:#E7EAE6}
      .h{font-size:15px;font-weight:700;fill:#0F3D2E}
      .sub{font-size:11px;fill:#6B7470}
      .b{fill:#fff;stroke:#0F3D2E;stroke-width:1.2}
      .db{fill:#ECFDF3;stroke:#0F3D2E;stroke-width:1.2}
      .t{font-size:13px;fill:#0B1215;font-weight:500}
      .l{font-size:10.5px;fill:#0F3D2E}
      .lo{font-size:10.5px;fill:#B45309;font-weight:600}
      .ln{stroke:#0F3D2E;stroke-width:1.3;fill:none}
      .auto{stroke:#D97706;stroke-width:1.5;fill:none}
      .off{stroke:#8A938F;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect class="col" x="15" y="15" width="235" height="530" rx="18"/>
  <rect class="col" x="375" y="15" width="250" height="530" rx="18"/>
  <rect class="col" x="775" y="15" width="210" height="530" rx="18"/>
  <text class="h" x="30" y="42">📱 Screens</text><text class="sub" x="30" y="58">React Native · Expo Router</text>
  <text class="h" x="390" y="42">🧩 Data layer</text><text class="sub" x="390" y="58">src/data — the only code that imports Firebase</text>
  <text class="h" x="790" y="42">☁️ Firebase</text><text class="sub" x="790" y="58">Auth + Cloud Firestore</text>

  <rect class="b" x="30" y="72" width="200" height="30" rx="9"/><text class="t" x="44" y="92">Login · M1</text>
  <rect class="b" x="30" y="127" width="200" height="30" rx="9"/><text class="t" x="44" y="147">Home / Dashboard · M2</text>
  <rect class="b" x="30" y="167" width="200" height="30" rx="9" style="stroke:#22C55E;stroke-width:2"/><text class="t" x="44" y="187">Greenhouse map ★</text>
  <rect class="b" x="30" y="207" width="200" height="30" rx="9" style="stroke:#22C55E;stroke-width:2"/><text class="t" x="44" y="227">Zone sheet ★</text>
  <rect class="b" x="30" y="262" width="200" height="30" rx="9"/><text class="t" x="44" y="282">Devices · M3</text>
  <rect class="b" x="30" y="332" width="200" height="30" rx="9"/><text class="t" x="44" y="352">Analysis · M6</text>
  <rect class="b" x="30" y="387" width="200" height="30" rx="9"/><text class="t" x="44" y="407">Alerts · M5</text>
  <rect class="b" x="30" y="442" width="200" height="30" rx="9"/><text class="t" x="44" y="462">Profile › Settings · M4 M7</text>
  <rect class="b" x="30" y="502" width="200" height="30" rx="9" style="stroke:#8A938F;stroke-dasharray:4 3"/><text class="t" x="44" y="522">“No connection” bar · M8</text>

  <rect class="b" x="390" y="70" width="220" height="34" rx="9"/><text class="t" x="404" y="92">authService</text>
  <rect class="b" x="390" y="145" width="220" height="34" rx="9"/><text class="t" x="404" y="167">zonesRepo</text><text class="sub" x="490" y="167">+ averages</text>
  <rect class="b" x="390" y="210" width="220" height="34" rx="9" style="stroke:#D97706;stroke-width:2;fill:#FFFBEB"/><text class="t" x="404" y="232">automationEngine</text><text class="sub" x="530" y="232">week 5</text>
  <rect class="b" x="390" y="275" width="220" height="34" rx="9"/><text class="t" x="404" y="297">devicesRepo</text>
  <rect class="b" x="390" y="330" width="220" height="34" rx="9"/><text class="t" x="404" y="352">historyRepo</text>
  <rect class="b" x="390" y="385" width="220" height="34" rx="9"/><text class="t" x="404" y="407">alertsRepo</text>
  <rect class="b" x="390" y="440" width="220" height="34" rx="9"/><text class="t" x="404" y="462">settingsRepo</text>
  <rect class="b" x="390" y="500" width="220" height="34" rx="9" style="stroke:#8A938F"/><text class="t" x="404" y="522">connectionMonitor</text>

  <rect class="db" x="790" y="70" width="180" height="34" rx="9"/><text class="t" x="804" y="92">Firebase Auth</text>
  <rect class="db" x="790" y="145" width="180" height="34" rx="9"/><text class="t" x="804" y="167">zones/</text><text class="sub" x="860" y="167">live readings</text>
  <rect class="db" x="790" y="255" width="180" height="34" rx="9"/><text class="t" x="804" y="277">devices/</text><text class="sub" x="866" y="277">isOn</text>
  <rect class="db" x="790" y="297" width="180" height="30" rx="9"/><text class="t" x="804" y="317">activity/</text><text class="sub" x="866" y="317">log</text>
  <rect class="db" x="790" y="330" width="180" height="34" rx="9"/><text class="t" x="804" y="352">history/</text><text class="sub" x="866" y="352">7+ days</text>
  <rect class="db" x="790" y="385" width="180" height="34" rx="9"/><text class="t" x="804" y="407">alerts/</text>
  <rect class="db" x="790" y="440" width="180" height="34" rx="9"/><text class="t" x="804" y="462">settings/main</text>
  <rect class="b" x="790" y="500" width="180" height="34" rx="9" style="stroke:#8A938F"/><text class="t" x="804" y="522">Phone network</text><text class="sub" x="906" y="522">NetInfo</text>

  <path class="ln" d="M230 87 L388 87" marker-end="url(#a)"/><text class="l" x="262" y="81">email + password</text>
  <path class="ln" d="M230 142 L388 156" marker-end="url(#a)"/>
  <path class="ln" d="M230 182 L388 162" marker-end="url(#a)"/>
  <path class="ln" d="M230 222 L388 170" marker-end="url(#a)"/><text class="l" x="262" y="136">subscribe (live)</text>
  <path class="ln" d="M230 226 L388 287" marker-end="url(#a)"/>
  <path class="ln" d="M230 277 L388 294" marker-end="url(#a)"/><text class="l" x="300" y="304">toggle device</text>
  <path class="ln" d="M230 347 L388 347" marker-end="url(#a)"/><text class="l" x="262" y="341">period + zone</text>
  <path class="ln" d="M230 402 L388 402" marker-end="url(#a)"/><text class="l" x="262" y="396">list / mark read</text>
  <path class="ln" d="M230 457 L388 457" marker-end="url(#a)"/><text class="l" x="262" y="451">save thresholds</text>
  <path class="off" d="M388 517 L232 517" marker-end="url(#g)"/><text class="sub" x="262" y="511">offline / back online</text>

  <path class="ln" d="M610 87 L788 87" marker-end="url(#a)"/><text class="l" x="680" y="81">sign in</text>
  <path class="ln" d="M612 162 L788 162" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="665" y="156">onSnapshot (realtime)</text>
  <path class="ln" d="M610 286 L788 272" marker-end="url(#a)"/><text class="l" x="664" y="272">batch: isOn</text>
  <path class="ln" d="M610 298 L788 312" marker-end="url(#a)"/><text class="l" x="664" y="318">+ log line</text>
  <path class="ln" d="M610 347 L788 347" marker-end="url(#a)"/><text class="l" x="664" y="341">query ts ≥ from</text>
  <path class="ln" d="M612 402 L788 402" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="680" y="396">write / listen</text>
  <path class="ln" d="M612 457 L788 457" marker-start="url(#a)" marker-end="url(#a)"/><text class="l" x="680" y="451">read / write</text>
  <path class="off" d="M788 517 L612 517" marker-end="url(#g)"/>

  <path class="auto" d="M470 179 L470 208" marker-end="url(#o)"/><text class="lo" x="478" y="198">new readings</text>
  <path class="auto" d="M470 244 L470 273" marker-end="url(#o)"/><text class="lo" x="478" y="263">turn on / off</text>
  <path class="auto" d="M610 462 L640 462 L640 234 L612 234" marker-end="url(#o)"/><text class="lo" x="646" y="245">rules</text>
  <path class="auto" d="M610 222 L655 222 L655 396 L612 396" marker-end="url(#o)"/><text class="lo" x="660" y="215">out of range → alert</text>

  <g transform="translate(15 565)">
    <path class="ln" d="M0 8 L30 8" marker-end="url(#a)"/><text class="sub" x="38" y="12">data the app reads / writes</text>
    <path class="auto" d="M210 8 L240 8" marker-end="url(#o)"/><text class="sub" x="248" y="12">automatic rules (M4, M5)</text>
    <path class="off" d="M420 8 L450 8" marker-end="url(#g)"/><text class="sub" x="458" y="12">connection state (M8)</text>
    <rect x="630" y="0" width="16" height="16" rx="4" fill="#fff" stroke="#22C55E" stroke-width="2"/><text class="sub" x="654" y="12">★ our extra feature: Live Zone Map</text>
  </g>
</svg>
